name: Documenti di gara
on:
  workflow_run:
    workflows: ["GaraPronta giornaliera"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      data:
        description: 'Giorno (gg/mm/aaaa), vuoto = ieri'
        required: false
      solo:
        description: 'Solo questi CIG (separati da virgola), per le prove'
        required: false
permissions:
  contents: write
concurrency: documenti
jobs:
  scarica:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Strumenti (pdf, firme digitali, browser automatico)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends poppler-utils sshpass p7zip-full tesseract-ocr tesseract-ocr-ita >/dev/null
          pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
      - name: Scarica documenti e testi
        env:
          DATA: ${{ github.event.inputs.data || (github.event_name == 'push' && '20/11/2026') || '' }}
          SOLO_CIG: ${{ github.event.inputs.solo }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: python pipeline/documenti.py
      - name: Riprova le gare non lette della settimana (solo nel giro automatico)
        if: github.event_name == 'workflow_run'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: timeout 3600 python tools/riprova_settimana.py || true
      - name: Rapporto di copertura
        run: python tools/copertura_report.py || true
      - name: Salva i testi
        run: |
          git config user.name "GaraPronta bot"; git config user.email "garapronta@users.noreply.github.com"
          git add testi/ docs/progetto/09_COPERTURA.md && git commit -q -m "Documenti di gara $(date -u +%F)" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push -q && break; sleep 7; done
