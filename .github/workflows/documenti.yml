name: Documenti di gara
on:
  workflow_run:
    workflows: ["GaraPronta giornaliera"]
    types: [completed]
  push:
    paths: ['pipeline/documenti.py', '.github/workflows/documenti.yml']
  workflow_dispatch:
    inputs:
      data:
        description: 'Giorno (gg/mm/aaaa), vuoto = ieri'
        required: false
permissions:
  contents: write
concurrency: documenti
jobs:
  scarica:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Strumenti (pdf, firme digitali, browser automatico)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils libreoffice-writer-nogui >/dev/null
          pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
      - name: Scarica documenti e testi
        env:
          DATA: ${{ github.event.inputs.data || (github.event_name == 'push' && '20/11/2026') || '' }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python pipeline/documenti.py
      - name: Salva i testi
        run: |
          git config user.name "GaraPronta bot"; git config user.email "garapronta@users.noreply.github.com"
          git add testi/ && git commit -q -m "Documenti di gara $(date -u +%F)" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && break; sleep 7; done
