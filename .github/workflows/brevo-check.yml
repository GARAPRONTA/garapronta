name: Controllo Brevo
on:
  push:
    paths: ['.github/workflows/brevo-check.yml']
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Contatti della lista Prova Gratuita
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          H=(-H "api-key: $BREVO_API_KEY" -H "accept: application/json" -H "content-type: application/json")
          B=https://api.brevo.com/v3
          echo "== Contatti nella lista 5 =="
          curl -s "${H[@]}" "$B/contacts/lists/5/contacts?limit=20" | jq -c '[.contacts[]? | {email, SOA: .attributes.SOA, REGIONE: .attributes.REGIONE}]'
