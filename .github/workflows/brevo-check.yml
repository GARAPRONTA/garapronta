name: Controllo Brevo
on:
  push:
    paths: ['.github/workflows/brevo-check.yml']
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Contatto di prova su "Tutta Italia" (per vedere un'email completa)
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          curl -s -o /dev/null -w "aggiornamento: HTTP %{http_code}\n" -X PUT "https://api.brevo.com/v3/contacts/garapronta%2Btest%40gmail.com" \
            -H "api-key: $BREVO_API_KEY" -H "content-type: application/json" -d '{"attributes":{"REGIONE":"Tutta Italia"}}'
