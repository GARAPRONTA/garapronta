name: Controllo Brevo
on:
  push:
    paths: ['.github/workflows/brevo-check.yml']
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Iscritti della lista 5
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          curl -s "https://api.brevo.com/v3/contacts/lists/5/contacts?limit=20" -H "api-key: $BREVO_API_KEY" | jq -c '[.contacts[]? | {email, SETTORE: .attributes.SETTORE, SOA: .attributes.SOA, REGIONE: .attributes.REGIONE}]'
