name: Controllo Brevo
on:
  push:
    paths: ['.github/workflows/brevo-check.yml']
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Crea l'attributo SETTORE
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          curl -s -w "\ncrea SETTORE: HTTP %{http_code}\n" -X POST "https://api.brevo.com/v3/contacts/attributes/normal/SETTORE" \
            -H "api-key: $BREVO_API_KEY" -H "content-type: application/json" -d '{"type":"text"}'
          curl -s -o /dev/null -w "settore contatto prova: HTTP %{http_code}\n" -X PUT "https://api.brevo.com/v3/contacts/garapronta%2Btest%40gmail.com" \
            -H "api-key: $BREVO_API_KEY" -H "content-type: application/json" -d '{"attributes":{"SETTORE":"Lavori edili"}}'
