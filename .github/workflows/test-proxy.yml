name: Test proxy Apify
on:
  push:
    paths: ['.github/workflows/test-proxy.yml']
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: Prova i gruppi di proxy
        env: { T: '${{ secrets.APIFY_TOKEN }}' }
        run: |
          [ -z "$T" ] && echo "TOKEN MANCANTE" && exit 0
          echo "piano/proxy:"; curl -s "https://api.apify.com/v2/users/me?token=$T" | jq -c '{plan:.data.plan.id, proxyGroups:[.data.proxy.groups[]?.name], proxyPassword:(.data.proxy.password|length>0)}'
          PW=$(curl -s "https://api.apify.com/v2/users/me?token=$T" | jq -r .data.proxy.password)
          for G in "groups-RESIDENTIAL,country-IT" "country-IT" "auto" "groups-BUYPROXIES94952"; do
            echo "== $G"
            curl -s -m 25 -o /dev/null -w "ipify HTTP %{http_code}\n" -x "http://$G:$PW@proxy.apify.com:8000" https://api.ipify.org || echo errore
            curl -s -m 25 -x "http://$G:$PW@proxy.apify.com:8000" "http://ip-api.com/json/?fields=country,isp" ; echo
            curl -s -m 25 -o /dev/null -w "tuttogare HTTP %{http_code} %{content_type}\n" -x "http://$G:$PW@proxy.apify.com:8000" "https://comunesanvittoreolona.tuttogare.it/allegati/open.php?codice=82&filename=YXZ2aXNvLW1hbmlmZXN0YXppb25lLWludGVyZXNzZS1kZWZpbml0aXZvLnBkZg==&sourceID=42&sourceType=Z2FyZS1wdWJsaWM=&general_connection=1"
          done
