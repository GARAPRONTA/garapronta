name: Server italiano – dataset ANAC
on:
  workflow_dispatch:
jobs:
  a:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - env: { SSHPASS: '${{ secrets.VPS_PASSWORD }}', H: '${{ secrets.VPS_HOST }}' }
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e scp -o StrictHostKeyChecking=no tools/anac_vps.sh root@$H:/opt/garapronta/
          sshpass -e ssh -o StrictHostKeyChecking=no root@$H "command -v unzip >/dev/null || apt-get install -y -qq unzip >/dev/null; bash /opt/garapronta/anac_vps.sh"
