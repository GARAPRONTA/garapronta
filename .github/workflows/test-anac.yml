name: Test accesso ANAC
on:
  push:
    paths: ['.github/workflows/test-anac.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Prova a leggere un giorno di avvisi
        run: |
          U="https://pubblicitalegale.anticorruzione.it/api/v0/avvisi?dataPubblicazioneStart=20/11/2026&dataPubblicazioneEnd=20/11/2026&page=0&size=5"
          curl -s -o r.json -w "HTTP %{http_code} in %{time_total}s\n" -A "Mozilla/5.0 GaraPronta" "$U"
          head -c 300 r.json; echo
          jq '{totalElements, totalPages}' r.json || true
