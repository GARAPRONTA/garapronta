name: Prezzari regionali (server italiano)
on:
  workflow_dispatch:
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - env: { SSHPASS: '${{ secrets.VPS_PASSWORD }}', H: '${{ secrets.VPS_HOST }}' }
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          O="-o StrictHostKeyChecking=no -o ServerAliveInterval=30"
          sshpass -e scp $O tools/prezzari_*.py root@$H:/opt/garapronta/
          sshpass -e ssh $O root@$H "cd /opt/garapronta && timeout 2400 ./venv/bin/python -u prezzari_cerca.py"
