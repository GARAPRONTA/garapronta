name: Prezzari regionali (server italiano)
on:
  workflow_dispatch:
    inputs:
      passo: { description: 'cerca | scarica | indice', default: 'cerca' }
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - env: { SSHPASS: '${{ secrets.VPS_PASSWORD }}', H: '${{ secrets.VPS_HOST }}', P: '${{ github.event.inputs.passo }}' }
        run: |
          case "$P" in cerca|scarica|indice) ;; *) echo "passo non valido"; exit 1;; esac
          sudo apt-get install -y -qq sshpass >/dev/null
          O="-o StrictHostKeyChecking=no -o ServerAliveInterval=30"
          sshpass -e scp $O tools/prezzari_*.py root@$H:/opt/garapronta/
          sshpass -e ssh $O root@$H "cd /opt/garapronta && ./venv/bin/pip install -q openpyxl odfpy xlrd pandas && timeout 2400 ./venv/bin/python -u prezzari_$P.py"
          if [ "$P" = indice ]; then
            mkdir -p indici/prezzari && sshpass -e scp $O "root@$H:/opt/garapronta/indici/prezzari/*.json.gz" indici/prezzari/
            git config user.name "GaraPronta bot"; git config user.email "garapronta@users.noreply.github.com"
            git add indici/prezzari && git commit -q -m "Prezzari regionali $(date -u +%F)" || exit 0
            for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && break; sleep 7; done
          fi
