name: Storico ANAC (12 mesi)
on:
  push:
    paths: ['pipeline/storico.py', '.github/workflows/storico.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mese:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        mese: ['2025-11','2025-12','2026-01','2026-02','2026-03','2026-04','2026-05','2026-06','2026-07','2026-08','2026-09','2026-10','2026-11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Scarica il mese
        env: { MESE: '${{ matrix.mese }}' }
        run: python pipeline/storico.py
      - name: Salva
        run: |
          git config user.name "GaraPronta bot"; git config user.email "garapronta@users.noreply.github.com"
          git add data/ && git commit -q -m "Storico ANAC ${{ matrix.mese }}" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && break; sleep $((RANDOM % 20 + 5)); done
