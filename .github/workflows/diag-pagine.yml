name: Diagnosi lettori (pagine di esempio)
on:
  workflow_dispatch:
    inputs:
      solo:
        description: 'Solo queste pagine (nomi separati da virgola), vuoto = tutte'
        required: false
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
      - name: Da GitHub (estero)
        run: timeout 1500 python tools/diag_pagine.py diag/estero "${{ github.event.inputs.solo }}" || true
      - name: Dal server italiano
        env: { SSHPASS: '${{ secrets.VPS_PASSWORD }}', H: '${{ secrets.VPS_HOST }}' }
        run: |
          sshpass -e scp -o StrictHostKeyChecking=no tools/diag_pagine.py root@$H:/opt/garapronta/
          sshpass -e ssh -o StrictHostKeyChecking=no root@$H "cd /opt/garapronta && rm -rf /tmp/diag && timeout 1500 ./venv/bin/python diag_pagine.py /tmp/diag '${{ github.event.inputs.solo }}'; true"
          mkdir -p diag/italia && sshpass -e ssh -o StrictHostKeyChecking=no root@$H "tar czf - -C /tmp/diag ." | tar xzf - -C diag/italia
      - run: |
          git config user.name "GaraPronta bot"; git config user.email "garapronta@users.noreply.github.com"
          git add diag && git commit -q -m "Diagnosi lettori $(date -u +%F)" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push -q && break; sleep 7; done
