name: Diagnosi link PVL
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python tools/diag_pvl.py
      - run: |
          git config user.name "GaraPronta bot"; git config user.email "garapronta@users.noreply.github.com"
          git add diag && git commit -q -m "Diagnosi link PVL" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push -q && break; sleep 7; done
