name: GaraPronta invio email
on:
  push:
    paths: ['resoconti/**']   # parte appena Claude ha scritto i resoconti del giorno
  schedule:
    - cron: '37 7 * * *'      # paracadute: 08:37 ora italiana, se i resoconti non sono arrivati
  workflow_dispatch:
    inputs:
      data:
        description: 'Giorno (gg/mm/aaaa), vuoto = ieri'
        required: false
permissions:
  contents: write
concurrency: invio
jobs:
  invia:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Già inviata oggi?
        id: fatto
        run: |
          git pull -q
          F="inviati/$(TZ=Europe/Rome date +%F)"
          echo "file=$F" >> $GITHUB_OUTPUT
          if [ -f "$F" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then echo "salta=1" >> $GITHUB_OUTPUT; echo "Email di oggi già inviata"; fi
      - uses: actions/setup-python@v5
        if: steps.fatto.outputs.salta != '1'
        with: { python-version: '3.12' }
      - name: Pubblica le schede complete delle gare (link "Leggi la descrizione completa")
        if: steps.fatto.outputs.salta != '1'
        env:
          DATA: ${{ github.event.inputs.data }}
          MODE: schede
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: '5'
        run: |
          python tools/enti_web.py
          python pipeline/garapronta.py
          git config user.name "GaraPronta bot"; git config user.email "garapronta@users.noreply.github.com"
          git add g indici && git commit -q -m "Schede gare $(TZ=Europe/Rome date +%F)" || true
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push -q && break; sleep 7; done
          sleep 90   # tempo perché GitHub Pages pubblichi le schede prima che arrivino le email
      - name: Invia le email (con i resoconti, se pronti)
        if: steps.fatto.outputs.salta != '1'
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: '5'
          DATA: ${{ github.event.inputs.data }}
          LIVE: '0'   # PROVA: scrive solo agli indirizzi con +test
          MODE: invio
        run: python pipeline/garapronta.py
      - name: Segna come inviata
        if: steps.fatto.outputs.salta != '1'
        run: |
          mkdir -p inviati && date -u +%FT%TZ > "${{ steps.fatto.outputs.file }}"
          git config user.name "GaraPronta bot"; git config user.email "garapronta@users.noreply.github.com"
          git add inviati && git commit -q -m "Email inviate $(TZ=Europe/Rome date +%F)" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push -q && break; sleep 7; done
      - uses: actions/upload-artifact@v4
        if: steps.fatto.outputs.salta != '1'
        with: { name: anteprime, path: anteprime/, retention-days: 7 }
