<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Segui un ente · GaraPronta</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1d1d1f;background:#f5f5f7;-webkit-font-smoothing:antialiased;
     min-height:100vh;display:grid;place-items:center;background-image:radial-gradient(60% 50% at 20% 10%,#cfe6ff 0%,transparent 70%),radial-gradient(50% 40% at 90% 90%,#efe6ff 0%,transparent 70%)}
.c{max-width:460px;margin:24px;background:rgba(255,255,255,.8);backdrop-filter:blur(20px);border:1px solid #fff;border-radius:30px;padding:36px 30px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.08)}
.i{width:64px;height:64px;border-radius:20px;background:#007aff;color:#fff;font-size:32px;display:grid;place-items:center;margin:0 auto 18px}
h1{font-size:26px;letter-spacing:-.03em;margin:0 0 10px;line-height:1.15} p{color:#6e6e73;font-size:15px;line-height:1.5;margin:0 0 18px}
a{display:inline-block;background:#1d1d1f;color:#fff;text-decoration:none;font-weight:600;border-radius:99px;padding:12px 22px}
</style>
</head>
<body>
<div class="c">
  <div class="i" id="ic">✓</div>
  <h1 id="t">Ora segui questo ente</h1>
  <p id="d">Da domani, nella tua email del mattino, ti diciamo cosa ha fatto: affidamenti, inviti, gare, elenchi di imprese aperti.</p>
  <a href="./">Torna a GaraPronta</a>
</div>
<script>
  var q = new URLSearchParams(location.search), n = q.get("n") || "questo ente";
  if (q.get("off")) {
    document.getElementById("ic").textContent = "–";
    document.getElementById("t").textContent = "Non segui più " + n;
    document.getElementById("d").textContent = "Da domani non riceverai più avvisi su questo ente. Puoi tornare a seguirlo quando vuoi dalla tua email.";
  } else {
    document.getElementById("t").textContent = "Ora segui " + n;
  }
</script>
</body>
</html>
